<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPlus Operations & POS Management System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel to compile JSX inside browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-receipt-area, #printable-receipt-area * {
                visibility: visible;
            }
            #printable-receipt-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 0;
                margin: 0;
                background: white;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Base categories and item templates for generating 500 SKUs
        const baseMedicines = [
            { name: "Paracetamol", type: "Tablets", basePrice: 20, dosages: ["250mg", "500mg", "650mg"] },
            { name: "Amoxicillin", type: "Tablets", basePrice: 85, dosages: ["250mg", "500mg"] },
            { name: "Azithromycin", type: "Tablets", basePrice: 110, dosages: ["250mg", "500mg"] },
            { name: "Ibuprofen", type: "Tablets", basePrice: 30, dosages: ["200mg", "400mg"] },
            { name: "Cefixime", type: "Tablets", basePrice: 95, dosages: ["100mg", "200mg"] },
            { name: "Ciprofloxacin", type: "Tablets", basePrice: 50, dosages: ["250mg", "500mg"] },
            { name: "Levofloxacin", type: "Tablets", basePrice: 75, dosages: ["500mg", "750mg"] },
            { name: "Metformin", type: "Tablets", basePrice: 25, dosages: ["500mg", "850mg", "1000mg"] },
            { name: "Atorvastatin", type: "Tablets", basePrice: 70, dosages: ["10mg", "20mg", "40mg"] },
            { name: "Telmisartan", type: "Tablets", basePrice: 65, dosages: ["20mg", "40mg", "80mg"] },
            { name: "Pantoprazole", type: "Tablets", basePrice: 80, dosages: ["20mg", "40mg"] },
            { name: "Omeprazole", type: "Tablets", basePrice: 45, dosages: ["20mg", "40mg"] },
            { name: "Rabeprazole", type: "Tablets", basePrice: 90, dosages: ["20mg"] },
            { name: "Montelukast", type: "Tablets", basePrice: 115, dosages: ["5mg", "10mg"] },
            { name: "Levocetirizine", type: "Tablets", basePrice: 35, dosages: ["5mg"] },
            { name: "Cetirizine", type: "Tablets", basePrice: 25, dosages: ["10mg"] },
            { name: "Amlodipine", type: "Tablets", basePrice: 30, dosages: ["2.5mg", "5mg", "10mg"] },
            { name: "Losartan", type: "Tablets", basePrice: 55, dosages: ["25mg", "50mg"] },
            { name: "Glimepiride", type: "Tablets", basePrice: 60, dosages: ["1mg", "2mg", "3mg"] },
            { name: "Vitamin D3", type: "Tablets", basePrice: 130, dosages: ["1K UI", "60K UI"] },
            { name: "Cough Syrup DX", type: "Syrups", basePrice: 110, dosages: ["100ml", "200ml"] },
            { name: "Antacid Liquid", type: "Syrups", basePrice: 135, dosages: ["150ml", "200ml"] },
            { name: "Multivitamin Syrup", type: "Syrups", basePrice: 145, dosages: ["200ml"] },
            { name: "Iron & Folic Syrup", type: "Syrups", basePrice: 160, dosages: ["200ml"] },
            { name: "Digestive Enzyme Syrup", type: "Syrups", basePrice: 120, dosages: ["200ml"] },
            { name: "Ceftriaxone Inj", type: "Injections", basePrice: 65, dosages: ["500mg", "1g"] },
            { name: "Insulin Glargine", type: "Injections", basePrice: 650, dosages: ["100 IU"] },
            { name: "Ondansetron Inj", type: "Injections", basePrice: 25, dosages: ["2ml"] },
            { name: "Diclofenac Inj", type: "Injections", basePrice: 20, dosages: ["1ml", "3ml"] },
            { name: "Meropenem Inj", type: "Injections", basePrice: 950, dosages: ["500mg", "1g"] },
            { name: "Pain Relief Gel", type: "Ointments", basePrice: 115, dosages: ["30g", "50g"] },
            { name: "Betadine Ointment", type: "Ointments", basePrice: 95, dosages: ["15g", "25g"] },
            { name: "Antifungal Cream", type: "Ointments", basePrice: 75, dosages: ["15g", "30g"] },
            { name: "Burn Cream", type: "Ointments", basePrice: 80, dosages: ["20g"] },
            { name: "Asthalin Inhaler", type: "Others", basePrice: 160, dosages: ["200 mdi"] },
            { name: "ORAL Rehydration Salts", type: "Others", basePrice: 22, dosages: ["21.8g Sachet"] }
        ];

        // Generate 500 SKUs dynamically
        const generateInventory = () => {
            const list = [];
            let idCounter = 1;

            for (let i = 0; i < 500; i++) {
                const base = baseMedicines[i % baseMedicines.length];
                const dosage = base.dosages[i % base.dosages.length];
                const catCode = base.type.substring(0, 3).toUpperCase();
                const variantNumber = Math.floor(i / baseMedicines.length) + 1;
                
                const expYear = 2026 + (i % 4);
                const expMonth = String((i % 12) + 1).padStart(2, '0');
                const expDay = String((i % 28) + 1).padStart(2, '0');

                list.push({
                    id: idCounter,
                    name: `${base.name} ${dosage}${variantNumber > 1 ? ` (Batch ${variantNumber})` : ''}`,
                    category: base.type,
                    stock: (i % 11 === 0) ? 0 : ((i * 7 + 12) % 150) + 1,
                    price: parseFloat((base.basePrice + (i % 15) * 2.5).toFixed(2)),
                    expiryDate: `${expYear}-${expMonth}-${expDay}`,
                    batchNumber: `MP-${catCode}${(100 + idCounter)}-${(i % 89) + 10}`
                });
                idCounter++;
            }
            return list;
        };

        const defaultInventory = generateInventory();

        const defaultUsers = [
            { email: "admin@medplus.com", password: "password123", name: "MedPlus Store Manager" }
        ];

        // Fresh LocalStorage Key to force 500 SKU dataset load
        const STORAGE_KEY_INV = 'medplus_inventory_v500_skus';
        const STORAGE_KEY_USERS = 'medplus_users_v500_skus';
        const STORAGE_KEY_TX = 'medplus_transactions_v500_skus';

        function App() {
            const [users, setUsers] = useState(() => {
                const localUsers = localStorage.getItem(STORAGE_KEY_USERS);
                return localUsers ? JSON.parse(localUsers) : defaultUsers;
            });

            const [currentUser, setCurrentUser] = useState(() => {
                const savedUser = localStorage.getItem('medplus_current_user_v500');
                return savedUser ? JSON.parse(savedUser) : null;
            });

            // Initializes with 500 items guaranteed
            const [inventory, setInventory] = useState(() => {
                const localInv = localStorage.getItem(STORAGE_KEY_INV);
                if (localInv) {
                    const parsed = JSON.parse(localInv);
                    if (parsed.length >= 500) return parsed;
                }
                return defaultInventory;
            });

            const [transactions, setTransactions] = useState(() => {
                const localTx = localStorage.getItem(STORAGE_KEY_TX);
                return localTx ? JSON.parse(localTx) : [];
            });

            const [activeTab, setActiveTab] = useState('inventory');
            const [authState, setAuthState] = useState('login'); 
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authName, setAuthName] = useState('');
            const [authError, setAuthError] = useState('');

            // Inventory Filter States
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All');
            const [stockFilter, setStockFilter] = useState('All'); 
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 10;

            // Inventory Modal state
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalMode, setModalMode] = useState('add'); 
            const [editingItemId, setEditingItemId] = useState(null);
            const [formData, setFormData] = useState({
                name: '', category: 'Tablets', stock: '', price: '', expiryDate: '', batchNumber: ''
            });

            // Sell / POS State
            const [posSearch, setPosSearch] = useState('');
            const [cart, setCart] = useState([]);
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [paymentMode, setPaymentMode] = useState('UPI');

            // 2-Step Payment Modal State
            const [qrModalOpen, setQrModalOpen] = useState(false);
            const [upiTxRef, setUpiTxRef] = useState('');
            const qrContainerRef = useRef(null);

            // Transaction History Search state
            const [txSearch, setTxSearch] = useState('');

            // Receipt View State
            const [receiptModal, setReceiptModal] = useState({ isOpen: false, transaction: null, copyType: 'customer' });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('medplus_current_user_v500', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('medplus_current_user_v500');
                }
            }, [currentUser]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_INV, JSON.stringify(inventory));
            }, [inventory]);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY_TX, JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, categoryFilter, stockFilter]);

            // Force clear old local storage if user wants to reset
            const handleResetTo500SKUs = () => {
                if (confirm("Reset inventory to original 500 SKUs? Any custom stock modifications will be restored.")) {
                    setInventory(defaultInventory);
                    localStorage.setItem(STORAGE_KEY_INV, JSON.stringify(defaultInventory));
                }
            };

            // Render QR Code in modal
            useEffect(() => {
                if (qrModalOpen && qrContainerRef.current) {
                    qrContainerRef.current.innerHTML = '';
                    const { grandTotal } = calculateCartTotals();
                    const upiString = `upi://pay?pa=medpluspharmacy@upi&pn=MedPlus+Pharmacy&am=${grandTotal.toFixed(2)}&cu=INR&tn=Invoice+${upiTxRef}`;
                    new QRCode(qrContainerRef.current, {
                        text: upiString,
                        width: 180,
                        height: 180,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }
            }, [qrModalOpen, upiTxRef]);

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                const foundUser = users.find(u => u.email === authEmail && u.password === authPassword);
                if (foundUser) {
                    setCurrentUser(foundUser);
                    setAuthEmail('');
                    setAuthPassword('');
                } else {
                    setAuthError('Invalid credentials. Quick Access: admin@medplus.com / password123');
                }
            };

            const handleSignUp = (e) => {
                e.preventDefault();
                setAuthError('');
                if (!authName || !authEmail || !authPassword) {
                    setAuthError('Please fill out all fields.');
                    return;
                }
                if (users.some(u => u.email === authEmail)) {
                    setAuthError('Email already registered.');
                    return;
                }
                const newUser = { email: authEmail, password: authPassword, name: authName };
                setUsers([...users, newUser]);
                setCurrentUser(newUser);
                setAuthName('');
                setAuthEmail('');
                setAuthPassword('');
            };

            const handleLogout = () => setCurrentUser(null);

            const handleOpenAddModal = () => {
                setModalMode('add');
                setFormData({ name: '', category: 'Tablets', stock: '', price: '', expiryDate: '', batchNumber: '' });
                setIsModalOpen(true);
            };

            const handleOpenEditModal = (item) => {
                setModalMode('edit');
                setEditingItemId(item.id);
                setFormData({
                    name: item.name,
                    category: item.category,
                    stock: item.stock.toString(),
                    price: item.price.toString(),
                    expiryDate: item.expiryDate,
                    batchNumber: item.batchNumber
                });
                setIsModalOpen(true);
            };

            const handleDeleteItem = (id) => {
                if (confirm("Are you sure you want to delete this medicine SKU?")) {
                    setInventory(inventory.filter(item => item.id !== id));
                    setCart(cart.filter(cartItem => cartItem.item.id !== id));
                }
            };

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const stockVal = parseInt(formData.stock, 10);
                const priceVal = parseFloat(formData.price);

                if (isNaN(stockVal) || isNaN(priceVal)) {
                    alert("Please fill valid numbers for quantity and price.");
                    return;
                }

                if (modalMode === 'add') {
                    const newItem = {
                        id: Date.now(),
                        name: formData.name,
                        category: formData.category,
                        stock: stockVal,
                        price: priceVal,
                        expiryDate: formData.expiryDate,
                        batchNumber: formData.batchNumber || `MP-NEW-${Math.floor(Math.random() * 900) + 100}`
                    };
                    setInventory([newItem, ...inventory]);
                } else {
                    setInventory(inventory.map(item => {
                        if (item.id === editingItemId) {
                            return {
                                ...item,
                                name: formData.name,
                                category: formData.category,
                                stock: stockVal,
                                price: priceVal,
                                expiryDate: formData.expiryDate,
                                batchNumber: formData.batchNumber
                            };
                        }
                        return item;
                    }));
                }
                setIsModalOpen(false);
            };

            const addToCart = (product) => {
                if (product.stock <= 0) {
                    alert("This medicine is currently Out of Stock!");
                    return;
                }
                const existingIndex = cart.findIndex(c => c.item.id === product.id);
                if (existingIndex > -1) {
                    const currentQty = cart[existingIndex].qty;
                    if (currentQty + 1 > product.stock) {
                        alert(`Cannot add more than available stock (${product.stock} units available).`);
                        return;
                    }
                    const updatedCart = [...cart];
                    updatedCart[existingIndex].qty += 1;
                    setCart(updatedCart);
                } else {
                    setCart([...cart, { item: product, qty: 1, gstRate: 12 }]);
                }
            };

            const updateCartQty = (productId, change) => {
                const updatedCart = cart.map(c => {
                    if (c.item.id === productId) {
                        const newQty = c.qty + change;
                        if (newQty > c.item.stock) {
                            alert(`Stock limit reached! Only ${c.item.stock} available.`);
                            return c;
                        }
                        return { ...c, qty: newQty };
                    }
                    return c;
                }).filter(c => c.qty > 0);
                setCart(updatedCart);
            };

            const updateCartGst = (productId, newGst) => {
                setCart(cart.map(c => c.item.id === productId ? { ...c, gstRate: parseFloat(newGst) } : c));
            };

            const removeFromCart = (productId) => {
                setCart(cart.filter(c => c.item.id !== productId));
            };

            const calculateCartTotals = () => {
                let taxableSubtotal = 0;
                let totalCgst = 0;
                let totalSgst = 0;

                cart.forEach(c => {
                    const itemTotal = c.item.price * c.qty;
                    taxableSubtotal += itemTotal;
                    const gstAmount = (itemTotal * c.gstRate) / 100;
                    totalCgst += gstAmount / 2;
                    totalSgst += gstAmount / 2;
                });

                const totalGst = totalCgst + totalSgst;
                const grandTotal = taxableSubtotal + totalGst;

                return { taxableSubtotal, totalCgst, totalSgst, totalGst, grandTotal };
            };

            const handleInitiateSale = () => {
                if (cart.length === 0) {
                    alert("Your billing cart is empty!");
                    return;
                }

                if (customerPhone && customerPhone.length !== 10) {
                    alert("Customer Mobile Number must be exactly 10 digits.");
                    return;
                }

                for (let c of cart) {
                    const currentItem = inventory.find(i => i.id === c.item.id);
                    if (!currentItem || currentItem.stock < c.qty) {
                        alert(`Insufficient stock for ${c.item.name}! Available: ${currentItem ? currentItem.stock : 0}`);
                        return;
                    }
                }

                if (paymentMode === 'UPI') {
                    setUpiTxRef(`INV-MP-${Date.now().toString().slice(-6)}`);
                    setQrModalOpen(true);
                } else {
                    executeCompleteSale();
                }
            };

            const executeCompleteSale = () => {
                const { taxableSubtotal, totalCgst, totalSgst, totalGst, grandTotal } = calculateCartTotals();
                const invoiceNumber = upiTxRef || `INV-MP-${Date.now().toString().slice(-6)}`;
                const saleTimestamp = new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });

                const newTransaction = {
                    invoiceNumber,
                    timestamp: saleTimestamp,
                    customerName: customerName.trim() || 'Walk-in Customer',
                    customerPhone: customerPhone.trim() || 'N/A',
                    cashier: currentUser ? currentUser.name : 'Store Staff',
                    paymentMode,
                    items: cart.map(c => ({
                        id: c.item.id,
                        name: c.item.name,
                        batchNumber: c.item.batchNumber,
                        expiryDate: c.item.expiryDate,
                        price: c.item.price,
                        qty: c.qty,
                        gstRate: c.gstRate,
                        taxableAmount: c.item.price * c.qty,
                        gstAmount: (c.item.price * c.qty * c.gstRate) / 100
                    })),
                    taxableSubtotal,
                    totalCgst,
                    totalSgst,
                    totalGst,
                    grandTotal
                };

                const updatedInventory = inventory.map(item => {
                    const cartMatch = cart.find(c => c.item.id === item.id);
                    if (cartMatch) {
                        return { ...item, stock: item.stock - cartMatch.qty };
                    }
                    return item;
                });

                setInventory(updatedInventory);
                setTransactions([newTransaction, ...transactions]);
                setCart([]);
                setCustomerName('');
                setCustomerPhone('');
                setQrModalOpen(false);
                setReceiptModal({ isOpen: true, transaction: newTransaction, copyType: 'customer' });
            };

            const totalProducts = inventory.length;
            const lowStockItems = inventory.filter(item => item.stock > 0 && item.stock <= 15).length;
            const outOfStockItems = inventory.filter(item => item.stock === 0).length;
            const totalValue = inventory.reduce((acc, item) => acc + (item.stock * item.price), 0);

            const filteredInventory = inventory.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      item.batchNumber.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesCategory = categoryFilter === 'All' || item.category === categoryFilter;
                let matchesStock = true;
                if (stockFilter === 'Low Stock') {
                    matchesStock = item.stock > 0 && item.stock <= 15;
                } else if (stockFilter === 'Out of Stock') {
                    matchesStock = item.stock === 0;
                }
                return matchesSearch && matchesCategory && matchesStock;
            });

            const posFilteredInventory = inventory.filter(item => 
                item.name.toLowerCase().includes(posSearch.toLowerCase()) || 
                item.batchNumber.toLowerCase().includes(posSearch.toLowerCase()) ||
                item.category.toLowerCase().includes(posSearch.toLowerCase())
            );

            const filteredTransactions = transactions.filter(tx => 
                tx.invoiceNumber.toLowerCase().includes(txSearch.toLowerCase()) ||
                tx.customerName.toLowerCase().includes(txSearch.toLowerCase()) ||
                tx.customerPhone.includes(txSearch)
            );

            const totalRevenue = transactions.reduce((acc, tx) => acc + tx.grandTotal, 0);
            const totalGstCollected = transactions.reduce((acc, tx) => acc + tx.totalGst, 0);

            const totalPages = Math.ceil(filteredInventory.length / itemsPerPage) || 1;
            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = filteredInventory.slice(indexOfFirstItem, indexOfLastItem);

            if (!currentUser) {
                return (
                    <div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
                        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
                            <div class="text-center">
                                <div class="inline-flex items-center justify-center p-3 bg-red-100 rounded-full mb-3">
                                    <svg class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                    </svg>
                                </div>
                                <h2 class="text-3xl font-black text-gray-950 tracking-tight">MedPlus</h2>
                                <p class="text-sm text-gray-500 mt-1 font-medium">Operations & Billing System</p>
                            </div>

                            {authState === 'login' ? (
                                <form class="mt-6 space-y-4" onSubmit={handleLogin}>
                                    <div class="rounded-md shadow-sm -space-y-px">
                                        <div>
                                            <input 
                                                type="email" 
                                                required 
                                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" 
                                                placeholder="Email Address"
                                                value={authEmail}
                                                onChange={(e) => setAuthEmail(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <input 
                                                type="password" 
                                                required 
                                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" 
                                                placeholder="Password"
                                                value={authPassword}
                                                onChange={(e) => setAuthPassword(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    {authError && <div class="text-sm text-red-600 bg-red-50 p-2 rounded-md border border-red-200">{authError}</div>}

                                    <div>
                                        <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-md text-white bg-red-600 hover:bg-red-700 transition duration-150">
                                            Sign In
                                        </button>
                                    </div>

                                    <div class="text-center mt-4">
                                        <p class="text-sm text-gray-600 font-medium">
                                            New staff member?{" "}
                                            <button type="button" onClick={() => { setAuthState('signup'); setAuthError(''); }} class="font-semibold text-red-600 hover:text-red-500">
                                                Create operational account
                                            </button>
                                        </p>
                                    </div>
                                    <div class="mt-4 p-3 bg-gray-50 border border-gray-200 rounded text-xs text-gray-600 flex flex-col space-y-1">
                                        <span class="font-bold text-gray-700">Quick-Login Credentials:</span>
                                        <span>Username: <strong class="font-mono text-red-600">admin@medplus.com</strong></span>
                                        <span>Password: <strong class="font-mono text-red-600">password123</strong></span>
                                    </div>
                                </form>
                            ) : (
                                <form class="mt-6 space-y-4" onSubmit={handleSignUp}>
                                    <div class="rounded-md shadow-sm -space-y-px">
                                        <div>
                                            <input 
                                                type="text" 
                                                required 
                                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" 
                                                placeholder="Staff Name"
                                                value={authName}
                                                onChange={(e) => setAuthName(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <input 
                                                type="email" 
                                                required 
                                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" 
                                                placeholder="Email Address"
                                                value={authEmail}
                                                onChange={(e) => setAuthEmail(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <input 
                                                type="password" 
                                                required 
                                                class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm" 
                                                placeholder="Secure Password"
                                                value={authPassword}
                                                onChange={(e) => setAuthPassword(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    {authError && <div class="text-sm text-red-600 bg-red-50 p-2 rounded-md border border-red-200">{authError}</div>}

                                    <div>
                                        <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-md text-white bg-red-600 hover:bg-red-700 transition duration-150">
                                            Register Staff Account
                                        </button>
                                    </div>

                                    <div class="text-center mt-4">
                                        <p class="text-sm text-gray-600 font-medium">
                                            Already registered?{" "}
                                            <button type="button" onClick={() => { setAuthState('login'); setAuthError(''); }} class="font-semibold text-red-600 hover:text-red-500">
                                                Log In here
                                            </button>
                                        </p>
                                    </div>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            const { taxableSubtotal, totalCgst, totalSgst, totalGst, grandTotal } = calculateCartTotals();

            return (
                <div class="min-h-screen flex flex-col bg-gray-50">
                    
                    {/* Header Navigation */}
                    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm no-print">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 md:py-0 md:h-16 gap-3">
                                
                                <div class="flex items-center space-x-3">
                                    <div class="bg-red-600 text-white p-2 rounded-lg flex items-center justify-center">
                                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                                        </svg>
                                    </div>
                                    <div>
                                        <span class="text-xl font-black text-red-600 tracking-tight">MedPlus</span>
                                        <span class="text-[10px] block text-gray-500 font-bold tracking-widest uppercase">Pharma Operations & POS</span>
                                    </div>
                                </div>

                                <div class="flex items-center space-x-2 bg-gray-100 p-1 rounded-xl">
                                    <button 
                                        onClick={() => setActiveTab('sell')}
                                        class={`flex items-center space-x-2 px-4 py-2 rounded-lg text-xs font-bold transition duration-150 ${activeTab === 'sell' ? 'bg-red-600 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                                        </svg>
                                        <span>1st New Sell</span>
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('inventory')}
                                        class={`flex items-center space-x-2 px-4 py-2 rounded-lg text-xs font-bold transition duration-150 ${activeTab === 'inventory' ? 'bg-red-600 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                        </svg>
                                        <span>2nd Inventory ({inventory.length} SKUs)</span>
                                    </button>

                                    <button 
                                        onClick={() => setActiveTab('transactions')}
                                        class={`flex items-center space-x-2 px-4 py-2 rounded-lg text-xs font-bold transition duration-150 ${activeTab === 'transactions' ? 'bg-red-600 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                        </svg>
                                        <span>3rd Transaction History</span>
                                    </button>
                                </div>

                                <div class="flex items-center space-x-3">
                                    <div class="text-right hidden sm:block">
                                        <span class="text-[10px] text-gray-400 block font-bold">OPERATIONS STAFF</span>
                                        <span class="text-xs font-bold text-gray-800">{currentUser.name}</span>
                                    </div>
                                    <button 
                                        onClick={handleLogout} 
                                        class="px-3 py-1.5 border border-gray-300 text-xs font-semibold rounded-lg text-gray-700 bg-white hover:bg-gray-50 hover:text-red-600"
                                    >
                                        Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 no-print">
                        
                        {/* TAB 1: NEW SELL (POS) SECTION */}
                        {activeTab === 'sell' && (
                            <div class="space-y-6">
                                <div class="flex justify-between items-center bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <div>
                                        <h1 class="text-xl font-black text-gray-900">New Sale & POS Billing</h1>
                                        <p class="text-xs text-gray-500">2-step checkout with UPI QR generation and Indian GST compliance.</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs text-gray-400 font-bold block uppercase">Cart Items</span>
                                        <span class="text-2xl font-black text-red-600">{cart.reduce((a, b) => a + b.qty, 0)} units</span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                    
                                    {/* Left Side: Product Selector */}
                                    <div class="lg:col-span-7 bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                                        <div class="relative">
                                            <input 
                                                type="text" 
                                                class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
                                                placeholder="Search medicine name, batch number, category..."
                                                value={posSearch}
                                                onChange={(e) => setPosSearch(e.target.value)}
                                            />
                                            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                            </svg>
                                        </div>

                                        <div class="max-h-[500px] overflow-y-auto space-y-2 pr-1">
                                            {posFilteredInventory.length > 0 ? (
                                                posFilteredInventory.map(prod => (
                                                    <div 
                                                        key={prod.id} 
                                                        class={`p-3 rounded-lg border transition duration-150 flex items-center justify-between ${
                                                            prod.stock === 0 ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-white border-gray-200 hover:border-red-400 hover:shadow-sm'
                                                        }`}
                                                    >
                                                        <div>
                                                            <div class="flex items-center space-x-2">
                                                                <h4 class="text-sm font-bold text-gray-900">{prod.name}</h4>
                                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-600">{prod.category}</span>
                                                            </div>
                                                            <div class="text-xs text-gray-400 font-mono mt-0.5">
                                                                Batch: {prod.batchNumber} | Exp: {prod.expiryDate}
                                                            </div>
                                                            <div class="text-xs font-bold text-red-600 mt-1">
                                                                ₹{prod.price.toFixed(2)} / unit
                                                            </div>
                                                        </div>

                                                        <div class="flex items-center space-x-3">
                                                            <div class="text-right">
                                                                <span class={`text-xs font-bold block ${prod.stock === 0 ? 'text-rose-600' : prod.stock <= 15 ? 'text-amber-600' : 'text-emerald-600'}`}>
                                                                    {prod.stock === 0 ? 'Out of Stock' : `${prod.stock} in stock`}
                                                                </span>
                                                            </div>
                                                            <button 
                                                                disabled={prod.stock === 0}
                                                                onClick={() => addToCart(prod)}
                                                                class="px-3 py-1.5 bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white text-xs font-bold rounded-lg transition duration-150"
                                                            >
                                                                + Add
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            ) : (
                                                <div class="text-center py-8 text-sm text-gray-500">No matching medicine SKUs found.</div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Right Side: Cart, GST Calculation & Customer Details */}
                                    <div class="lg:col-span-5 bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6 flex flex-col justify-between">
                                        <div class="space-y-4">
                                            <h2 class="text-lg font-bold text-gray-900 border-b pb-2 flex items-center justify-between">
                                                <span>Billing Cart</span>
                                                <span class="text-xs font-normal text-gray-500">GST Breakdown Included</span>
                                            </h2>

                                            {/* Cart Items List */}
                                            <div class="max-h-[220px] overflow-y-auto space-y-3 pr-1">
                                                {cart.length > 0 ? (
                                                    cart.map(c => (
                                                        <div key={c.item.id} class="p-2.5 bg-gray-50 rounded-lg border border-gray-200 space-y-2">
                                                            <div class="flex justify-between items-start">
                                                                <div>
                                                                    <div class="text-xs font-bold text-gray-900">{c.item.name}</div>
                                                                    <div class="text-[10px] text-gray-500 font-mono">₹{c.item.price.toFixed(2)} × {c.qty}</div>
                                                                </div>
                                                                <div class="text-right">
                                                                    <span class="text-xs font-bold text-gray-900">₹{(c.item.price * c.qty).toFixed(2)}</span>
                                                                    <button 
                                                                        onClick={() => removeFromCart(c.item.id)} 
                                                                        class="block text-[10px] text-red-600 font-bold hover:underline ml-auto"
                                                                    >
                                                                        Remove
                                                                    </button>
                                                                </div>
                                                            </div>

                                                            <div class="flex items-center justify-between pt-1 border-t border-gray-200">
                                                                <div class="flex items-center space-x-1">
                                                                    <button 
                                                                        onClick={() => updateCartQty(c.item.id, -1)}
                                                                        class="w-6 h-6 bg-gray-200 hover:bg-gray-300 font-bold text-xs rounded flex items-center justify-center"
                                                                    >
                                                                        -
                                                                    </button>
                                                                    <span class="text-xs font-bold w-6 text-center">{c.qty}</span>
                                                                    <button 
                                                                        onClick={() => updateCartQty(c.item.id, 1)}
                                                                        class="w-6 h-6 bg-gray-200 hover:bg-gray-300 font-bold text-xs rounded flex items-center justify-center"
                                                                    >
                                                                        +
                                                                    </button>
                                                                </div>

                                                                <div class="flex items-center space-x-2">
                                                                    <span class="text-[10px] font-bold text-gray-500">GST Rate:</span>
                                                                    <select 
                                                                        value={c.gstRate} 
                                                                        onChange={(e) => updateCartGst(c.item.id, e.target.value)}
                                                                        class="text-xs border rounded px-1 py-0.5 font-bold bg-white"
                                                                    >
                                                                        <option value="5">5%</option>
                                                                        <option value="12">12%</option>
                                                                        <option value="18">18%</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div class="text-center py-6 text-xs text-gray-400 font-medium">Cart is empty. Add items from the left list.</div>
                                                )}
                                            </div>

                                            {/* Customer Details Form */}
                                            <div class="space-y-3 pt-3 border-t border-gray-100">
                                                <h3 class="text-xs font-bold uppercase text-gray-500">Customer & Payment Info</h3>
                                                <div class="grid grid-cols-2 gap-2">
                                                    <input 
                                                        type="text" 
                                                        placeholder="Customer Name"
                                                        value={customerName}
                                                        onChange={(e) => setCustomerName(e.target.value)}
                                                        class="px-2.5 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-red-500"
                                                    />
                                                    <input 
                                                        type="tel" 
                                                        maxLength={10}
                                                        placeholder="Mobile (10 Digits)"
                                                        value={customerPhone}
                                                        onChange={(e) => setCustomerPhone(e.target.value.replace(/\D/g, ''))}
                                                        class="px-2.5 py-1.5 border border-gray-300 rounded text-xs focus:outline-none focus:ring-1 focus:ring-red-500"
                                                    />
                                                </div>

                                                <div>
                                                    <label class="text-[10px] font-bold text-gray-500 block mb-1 uppercase">Payment Mode</label>
                                                    <div class="grid grid-cols-3 gap-2">
                                                        {['UPI', 'Cash', 'Card'].map(mode => (
                                                            <button 
                                                                key={mode}
                                                                type="button"
                                                                onClick={() => setPaymentMode(mode)}
                                                                class={`py-1 rounded text-xs font-bold border ${paymentMode === mode ? 'bg-red-50 border-red-500 text-red-600' : 'border-gray-200 text-gray-600 bg-gray-50'}`}
                                                            >
                                                                {mode}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Taxable Calculation Summary */}
                                            <div class="bg-gray-50 p-3 rounded-lg space-y-1.5 border border-gray-200 text-xs">
                                                <div class="flex justify-between text-gray-600">
                                                    <span>Taxable Subtotal:</span>
                                                    <span class="font-medium">₹{taxableSubtotal.toFixed(2)}</span>
                                                </div>
                                                <div class="flex justify-between text-gray-600">
                                                    <span>CGST Total:</span>
                                                    <span class="font-medium">₹{totalCgst.toFixed(2)}</span>
                                                </div>
                                                <div class="flex justify-between text-gray-600">
                                                    <span>SGST Total:</span>
                                                    <span class="font-medium">₹{totalSgst.toFixed(2)}</span>
                                                </div>
                                                <div class="flex justify-between font-black text-gray-900 text-sm pt-1.5 border-t border-gray-200">
                                                    <span>Grand Total (Incl. GST):</span>
                                                    <span class="text-red-600">₹{grandTotal.toFixed(2)}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={handleInitiateSale}
                                            disabled={cart.length === 0}
                                            class="w-full py-3 bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white font-black text-sm rounded-lg shadow transition duration-150"
                                        >
                                            {paymentMode === 'UPI' ? 'Step 1: Generate UPI QR Code' : 'Complete Sale & Generate Invoice'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: INVENTORY MANAGEMENT SECTION */}
                        {activeTab === 'inventory' && (
                            <div class="space-y-6">
                                {/* Summary Stat Panels */}
                                <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div class="p-3.5 bg-blue-100 text-blue-600 rounded-lg">
                                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                            </svg>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Total SKUs Loaded</p>
                                            <p class="text-3xl font-black text-gray-900">{totalProducts}</p>
                                        </div>
                                    </div>

                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div class="p-3.5 bg-amber-100 text-amber-600 rounded-lg">
                                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                            </svg>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Low Stock (≤15)</p>
                                            <p class="text-3xl font-black text-amber-600">{lowStockItems}</p>
                                        </div>
                                    </div>

                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div class="p-3.5 bg-rose-100 text-rose-600 rounded-lg">
                                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                                            </svg>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Out Of Stock</p>
                                            <p class="text-3xl font-black text-rose-600">{outOfStockItems}</p>
                                        </div>
                                    </div>

                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex items-center space-x-4">
                                        <div class="p-3.5 bg-emerald-100 text-emerald-600 rounded-lg">
                                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 8h6m-5 0a3 3 0 110 6H9l3 3m-3-6h6m6 1a9 9 0 11-18 0 9 9 0 0118 0z" />
                                            </svg>
                                        </div>
                                        <div>
                                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Net Valuation</p>
                                            <p class="text-2xl font-black text-gray-900">₹{totalValue.toLocaleString('en-IN', { maximumFractionDigits: 0 })}</p>
                                        </div>
                                    </div>
                                </section>

                                {/* Filters and Add Button */}
                                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                                    <div class="flex flex-col sm:flex-row gap-3 flex-grow max-w-5xl">
                                        <div class="relative flex-grow sm:max-w-md">
                                            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                                <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                                </svg>
                                            </span>
                                            <input 
                                                type="text" 
                                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                placeholder="Search SKUs by Name or Batch..."
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                            />
                                        </div>
                                        
                                        <div class="w-full sm:w-48">
                                            <select 
                                                class="block w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 font-medium text-gray-700"
                                                value={categoryFilter}
                                                onChange={(e) => setCategoryFilter(e.target.value)}
                                            >
                                                <option value="All">All Categories</option>
                                                <option value="Tablets">Tablets</option>
                                                <option value="Syrups">Syrups</option>
                                                <option value="Injections">Injections</option>
                                                <option value="Ointments">Ointments</option>
                                                <option value="Others">Others</option>
                                            </select>
                                        </div>

                                        <div class="w-full sm:w-48">
                                            <select 
                                                class="block w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 font-medium text-gray-700"
                                                value={stockFilter}
                                                onChange={(e) => setStockFilter(e.target.value)}
                                            >
                                                <option value="All">All Stock Levels</option>
                                                <option value="Low Stock">Low Stock (≤15)</option>
                                                <option value="Out of Stock">Out of Stock</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="flex items-center space-x-2">
                                        <button 
                                            onClick={handleResetTo500SKUs} 
                                            class="inline-flex items-center justify-center px-3 py-2.5 border border-gray-300 text-xs font-bold rounded-lg text-gray-700 bg-gray-50 hover:bg-gray-100 transition duration-150"
                                        >
                                            Reload 500 SKUs
                                        </button>
                                        <button 
                                            onClick={handleOpenAddModal} 
                                            class="inline-flex items-center justify-center px-4 py-2.5 border border-transparent text-sm font-semibold rounded-lg text-white bg-red-600 hover:bg-red-700 transition duration-150"
                                        >
                                            <svg class="-ml-1 mr-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                                            </svg>
                                            Add SKU
                                        </button>
                                    </div>
                                </div>

                                {/* Table */}
                                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                                    <div class="overflow-x-auto">
                                        <table class="min-w-full divide-y divide-gray-200">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">SKU Medicine / Batch</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Category</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Quantity</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">MRP / Unit</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Expiry</th>
                                                    <th class="px-6 py-3.5 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody class="bg-white divide-y divide-gray-200">
                                                {currentItems.length > 0 ? (
                                                    currentItems.map((item) => {
                                                        let stockBadgeClass = "px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-emerald-50 text-emerald-800 border border-emerald-100";
                                                        let stockLabel = "In Stock";
                                                        if (item.stock === 0) {
                                                            stockBadgeClass = "px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-rose-50 text-rose-800 border border-rose-100 animate-pulse";
                                                            stockLabel = "Out of Stock";
                                                        } else if (item.stock <= 15) {
                                                            stockBadgeClass = "px-2.5 py-0.5 text-[10px] font-bold rounded-full bg-amber-50 text-amber-800 border border-amber-100";
                                                            stockLabel = "Low Stock";
                                                        }

                                                        return (
                                                            <tr key={item.id} class="hover:bg-gray-50/75 transition duration-100">
                                                                <td class="px-6 py-4 whitespace-nowrap">
                                                                    <div class="flex flex-col">
                                                                        <span class="text-sm font-semibold text-gray-900">{item.name}</span>
                                                                        <span class="text-xs text-gray-400 font-mono mt-0.5">{item.batchNumber}</span>
                                                                    </div>
                                                                </td>
                                                                <td class="px-6 py-4 whitespace-nowrap">
                                                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-bold bg-gray-100 text-gray-700 border border-gray-200">
                                                                        {item.category}
                                                                    </span>
                                                                </td>
                                                                <td class="px-6 py-4 whitespace-nowrap">
                                                                    <div class="flex items-center space-x-2">
                                                                        <span class="text-sm font-black text-gray-900">{item.stock}</span>
                                                                        <span class={stockBadgeClass}>{stockLabel}</span>
                                                                    </div>
                                                                </td>
                                                                <td class="px-6 py-4 whitespace-nowrap">
                                                                    <span class="text-sm font-bold text-gray-950">₹{item.price.toFixed(2)}</span>
                                                                </td>
                                                                <td class="px-6 py-4 whitespace-nowrap">
                                                                    <span class="text-sm text-gray-600 font-medium">{item.expiryDate}</span>
                                                                </td>
                                                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-bold">
                                                                    <button 
                                                                        onClick={() => handleOpenEditModal(item)} 
                                                                        class="text-blue-600 hover:text-blue-900 mr-4"
                                                                    >
                                                                        Edit
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => handleDeleteItem(item.id)} 
                                                                        class="text-red-600 hover:text-red-900"
                                                                    >
                                                                        Delete
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })
                                                ) : (
                                                    <tr>
                                                        <td colSpan="6" class="px-6 py-12 text-center text-sm text-gray-500 font-medium">
                                                            No operational SKUs found matching query settings.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* Pagination */}
                                    <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
                                        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                                            <div>
                                                <p class="text-xs text-gray-500 font-medium">
                                                    Showing <span class="font-bold text-gray-900">{filteredInventory.length > 0 ? indexOfFirstItem + 1 : 0}</span> to <span class="font-bold text-gray-900">{Math.min(indexOfLastItem, filteredInventory.length)}</span> of <span class="font-bold text-gray-900">{filteredInventory.length}</span> SKUs
                                                </p>
                                            </div>
                                            <div>
                                                <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
                                                    <button
                                                        disabled={currentPage === 1}
                                                        onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                                                        class="px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50"
                                                    >
                                                        Previous
                                                    </button>
                                                    <span class="px-4 py-2 border border-gray-300 bg-white text-xs font-bold text-gray-700">
                                                        Page {currentPage} of {totalPages}
                                                    </span>
                                                    <button
                                                        disabled={currentPage === totalPages}
                                                        onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                                                        class="px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 disabled:opacity-50"
                                                    >
                                                        Next
                                                    </button>
                                                </nav>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: TRANSACTION HISTORY SECTION */}
                        {activeTab === 'transactions' && (
                            <div class="space-y-6">
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Total Sales Revenue</p>
                                        <p class="text-3xl font-black text-emerald-600">₹{totalRevenue.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</p>
                                    </div>
                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Completed Sales</p>
                                        <p class="text-3xl font-black text-blue-600">{transactions.length}</p>
                                    </div>
                                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                                        <p class="text-xs font-bold text-gray-400 uppercase">Total GST Collected</p>
                                        <p class="text-3xl font-black text-red-600">₹{totalGstCollected.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</p>
                                    </div>
                                </div>
