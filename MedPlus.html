                                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                    <input 
                                        type="text" 
                                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
                                        placeholder="Search transactions by Invoice Number, Customer Name, or Phone..."
                                        value={txSearch}
                                        onChange={(e) => setTxSearch(e.target.value)}
                                    />
                                </div>

                                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                                    <div class="overflow-x-auto">
                                        <table class="min-w-full divide-y divide-gray-200">
                                            <thead class="bg-gray-50">
                                                <tr>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase">Invoice # / Date</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase">Customer</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase">Items</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase">Payment</th>
                                                    <th class="px-6 py-3.5 text-left text-xs font-bold text-gray-500 uppercase">Amount</th>
                                                    <th class="px-6 py-3.5 text-right text-xs font-bold text-gray-500 uppercase">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-gray-200">
                                                {filteredTransactions.length > 0 ? (
                                                    filteredTransactions.map(tx => (
                                                        <tr key={tx.invoiceNumber} class="hover:bg-gray-50">
                                                            <td class="px-6 py-4 whitespace-nowrap">
                                                                <div class="font-bold text-sm text-gray-900">{tx.invoiceNumber}</div>
                                                                <div class="text-xs text-gray-400">{tx.timestamp}</div>
                                                            </td>
                                                            <td class="px-6 py-4 whitespace-nowrap">
                                                                <div class="text-sm font-semibold text-gray-800">{tx.customerName}</div>
                                                                <div class="text-xs text-gray-400">{tx.customerPhone}</div>
                                                            </td>
                                                            <td class="px-6 py-4 whitespace-nowrap">
                                                                <span class="text-xs font-bold px-2 py-1 rounded bg-gray-100 text-gray-700">
                                                                    {tx.items.reduce((a, b) => a + b.qty, 0)} items
                                                                </span>
                                                            </td>
                                                            <td class="px-6 py-4 whitespace-nowrap">
                                                                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">
                                                                    {tx.paymentMode}
                                                                </span>
                                                            </td>
                                                            <td class="px-6 py-4 whitespace-nowrap">
                                                                <div class="text-sm font-black text-gray-900">₹{tx.grandTotal.toFixed(2)}</div>
                                                                <div class="text-[10px] text-gray-400">GST: ₹{tx.totalGst.toFixed(2)}</div>
                                                            </td>
                                                            <td class="px-6 py-4 whitespace-nowrap text-right space-x-2">
                                                                <button 
                                                                    onClick={() => setReceiptModal({ isOpen: true, transaction: tx, copyType: 'customer' })}
                                                                    class="px-2.5 py-1 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded border border-red-200"
                                                                >
                                                                    Customer Copy
                                                                </button>
                                                                <button 
                                                                    onClick={() => setReceiptModal({ isOpen: true, transaction: tx, copyType: 'store' })}
                                                                    class="px-2.5 py-1 text-xs font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded border border-gray-300"
                                                                >
                                                                    Store Copy
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="6" class="px-6 py-12 text-center text-sm text-gray-500">
                                                            No transaction history logged yet. Complete sales in "1st New Sell" to view records here.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer Details */}
                    <footer class="bg-white border-t border-gray-200 py-6 mt-12 no-print">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <p class="text-xs text-gray-400 font-bold tracking-wider uppercase">© MedPlus Operations & Billing Control Portal. Internal Operational Use.</p>
                        </div>
                    </footer>

                    {/* Step 1: UPI QR CODE MODAL */}
                    {qrModalOpen && (
                        <div class="fixed inset-0 z-50 overflow-y-auto bg-gray-900 bg-opacity-70 flex items-center justify-center p-4">
                            <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl p-6 text-center space-y-4 border border-gray-200">
                                <div class="flex justify-between items-center border-b pb-3">
                                    <h3 class="text-base font-extrabold text-gray-900">Step 1: Scan UPI QR Code</h3>
                                    <button onClick={() => setQrModalOpen(false)} class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
                                </div>

                                <div class="bg-red-50 border border-red-100 rounded-xl p-3">
                                    <p class="text-xs text-gray-500 font-semibold uppercase">Total Amount Payable</p>
                                    <p class="text-3xl font-black text-red-600">₹{grandTotal.toFixed(2)}</p>
                                    <p class="text-[10px] text-gray-400 font-mono mt-0.5">Ref ID: {upiTxRef}</p>
                                </div>

                                <div class="flex justify-center p-3 bg-white rounded-xl border border-gray-200 shadow-inner">
                                    <div ref={qrContainerRef}></div>
                                </div>

                                <p class="text-xs text-gray-500">Scan with Google Pay, PhonePe, Paytm, or BHIM to complete standard Indian GST transaction.</p>

                                <div class="pt-2 border-t space-y-2">
                                    <button 
                                        onClick={executeCompleteSale}
                                        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-lg shadow transition duration-150"
                                    >
                                        Step 2: Confirm Payment & Complete Sale
                                    </button>
                                    <button 
                                        onClick={() => setQrModalOpen(false)}
                                        class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-lg transition duration-150"
                                    >
                                        Cancel Transaction
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add / Edit Inventory SKU Modal */}
                    {isModalOpen && (
                        <div class="fixed inset-0 z-50 overflow-y-auto no-print">
                            <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                                <div class="fixed inset-0 bg-gray-500 bg-opacity-75" onClick={() => setIsModalOpen(false)}></div>
                                <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>

                                <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full border border-gray-200">
                                    <form onSubmit={handleFormSubmit}>
                                        <div class="bg-white px-6 pt-6 pb-4">
                                            <div class="flex justify-between items-center pb-3 border-b border-gray-100">
                                                <h3 class="text-lg font-bold text-gray-900">
                                                    {modalMode === 'add' ? 'Add New SKU Medicine' : 'Modify Existing Batch SKU'}
                                                </h3>
                                                <button type="button" onClick={() => setIsModalOpen(false)} class="text-gray-400 hover:text-gray-500">
                                                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                    </svg>
                                                </button>
                                            </div>

                                            <div class="space-y-4 mt-4">
                                                <div>
                                                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Medicine Name *</label>
                                                    <input 
                                                        type="text" 
                                                        required 
                                                        class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                        placeholder="e.g. Paracetamol 650mg"
                                                        value={formData.name}
                                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                    />
                                                </div>

                                                <div class="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Category *</label>
                                                        <select 
                                                            class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"
                                                            value={formData.category}
                                                            onChange={(e) => setFormData({...formData, category: e.target.value})}
                                                        >
                                                            <option value="Tablets">Tablets</option>
                                                            <option value="Syrups">Syrups</option>
                                                            <option value="Injections">Injections</option>
                                                            <option value="Ointments">Ointments</option>
                                                            <option value="Others">Others</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Batch Code</label>
                                                        <input 
                                                            type="text" 
                                                            class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                            placeholder="e.g. MP-TAB110-14"
                                                            value={formData.batchNumber}
                                                            onChange={(e) => setFormData({...formData, batchNumber: e.target.value})}
                                                        />
                                                    </div>
                                                </div>

                                                <div class="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Quantity *</label>
                                                        <input 
                                                            type="number" 
                                                            required 
                                                            min="0"
                                                            class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                            placeholder="0"
                                                            value={formData.stock}
                                                            onChange={(e) => setFormData({...formData, stock: e.target.value})}
                                                        />
                                                    </div>
                                                    <div>
                                                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">MRP Price (₹) *</label>
                                                        <input 
                                                            type="number" 
                                                            step="0.01" 
                                                            min="0"
                                                            required 
                                                            class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                            placeholder="0.00"
                                                            value={formData.price}
                                                            onChange={(e) => setFormData({...formData, price: e.target.value})}
                                                        />
                                                    </div>
                                                </div>

                                                <div>
                                                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Expiry Date *</label>
                                                    <input 
                                                        type="date" 
                                                        required 
                                                        class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-red-500" 
                                                        value={formData.expiryDate}
                                                        onChange={(e) => setFormData({...formData, expiryDate: e.target.value})}
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        <div class="bg-gray-50 px-6 py-4 flex justify-end space-x-3 rounded-b-xl border-t border-gray-100">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsModalOpen(false)} 
                                                class="px-4 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="px-4 py-2 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg"
                                            >
                                                {modalMode === 'add' ? 'Register SKU' : 'Save Details'}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* RECEIPT MODAL (Customer & Store Copies) */}
                    {receiptModal.isOpen && receiptModal.transaction && (
                        <div class="fixed inset-0 z-50 overflow-y-auto bg-gray-900 bg-opacity-60 flex items-center justify-center p-4">
                            <div class="bg-white rounded-xl max-w-xl w-full shadow-2xl overflow-hidden border border-gray-200">
                                
                                <div class="bg-gray-900 text-white p-4 flex justify-between items-center no-print">
                                    <div class="flex items-center space-x-2">
                                        <button 
                                            onClick={() => setReceiptModal({ ...receiptModal, copyType: 'customer' })}
                                            class={`px-3 py-1 rounded text-xs font-bold ${receiptModal.copyType === 'customer' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}
                                        >
                                            Customer Receipt
                                        </button>
                                        <button 
                                            onClick={() => setReceiptModal({ ...receiptModal, copyType: 'store' })}
                                            class={`px-3 py-1 rounded text-xs font-bold ${receiptModal.copyType === 'store' ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}
                                        >
                                            Store Copy
                                        </button>
                                    </div>

                                    <div class="flex items-center space-x-3">
                                        <button 
                                            onClick={() => window.print()} 
                                            class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded flex items-center space-x-1"
                                        >
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                                            </svg>
                                            <span>Print</span>
                                        </button>
                                        <button 
                                            onClick={() => setReceiptModal({ isOpen: false, transaction: null, copyType: 'customer' })}
                                            class="text-gray-400 hover:text-white font-bold text-lg"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>

                                {/* Printable Receipt Layout */}
                                <div id="printable-receipt-area" class="p-8 space-y-6 text-gray-800 text-sm font-sans">
                                    
                                    <div class="text-center space-y-1 border-b border-gray-200 pb-4">
                                        <div class="flex justify-center items-center space-x-2">
                                            <h2 class="text-2xl font-black text-red-600 tracking-tight">MedPlus Pharmacy</h2>
                                        </div>
                                        <p class="text-xs font-semibold text-gray-600">Retail Operational Unit & Health Supplies</p>
                                        <p class="text-[11px] text-gray-500">GSTIN: 36AABCM8890C1Z4 | Lic No: 20B/21B-TS/2026</p>
                                        
                                        <div class="mt-2 inline-block px-3 py-0.5 rounded-full text-xs font-black uppercase border tracking-wider" style={{
                                            backgroundColor: receiptModal.copyType === 'customer' ? '#eff6ff' : '#fff1f2',
                                            color: receiptModal.copyType === 'customer' ? '#1e40af' : '#991b1b',
                                            borderColor: receiptModal.copyType === 'customer' ? '#bfdbfe' : '#fecdd3'
                                        }}>
                                            {receiptModal.copyType === 'customer' ? 'CUSTOMER TAX INVOICE' : 'STORE AUDIT COPY / INTERNAL RECORD'}
                                        </div>
                                    </div>

                                    {/* Invoice Metadata */}
                                    <div class="grid grid-cols-2 text-xs border-b border-gray-200 pb-3 gap-2">
                                        <div>
                                            <span class="text-gray-500 block">Invoice #:</span>
                                            <strong class="font-mono text-gray-900">{receiptModal.transaction.invoiceNumber}</strong>
                                        </div>
                                        <div>
                                            <span class="text-gray-500 block">Date & Time:</span>
                                            <strong class="text-gray-900">{receiptModal.transaction.timestamp}</strong>
                                        </div>
                                        <div>
                                            <span class="text-gray-500 block">Customer Name:</span>
                                            <strong class="text-gray-900">{receiptModal.transaction.customerName}</strong>
                                        </div>
                                        <div>
                                            <span class="text-gray-500 block">Phone / Payment Mode:</span>
                                            <strong class="text-gray-900">{receiptModal.transaction.customerPhone} ({receiptModal.transaction.paymentMode})</strong>
                                        </div>
                                        {receiptModal.copyType === 'store' && (
                                            <div class="col-span-2 pt-1">
                                                <span class="text-gray-500 block">Billed By Staff Cashier:</span>
                                                <strong class="text-red-600">{receiptModal.transaction.cashier}</strong>
                                            </div>
                                        )}
                                    </div>

                                    {/* Itemized Table */}
                                    <div>
                                        <table class="w-full text-xs text-left">
                                            <thead>
                                                <tr class="border-b-2 border-gray-800 text-gray-900 font-bold uppercase">
                                                    <th class="py-1">Item</th>
                                                    <th class="py-1 text-center">Batch / Exp</th>
                                                    <th class="py-1 text-center">Qty</th>
                                                    <th class="py-1 text-center">GST %</th>
                                                    <th class="py-1 text-right">Amount (₹)</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-gray-100">
                                                {receiptModal.transaction.items.map((it, idx) => (
                                                    <tr key={idx}>
                                                        <td class="py-2">
                                                            <div class="font-bold text-gray-900">{it.name}</div>
                                                            <div class="text-[10px] text-gray-400">Rate: ₹{it.price.toFixed(2)}</div>
                                                        </td>
                                                        <td class="py-2 text-center text-[10px] font-mono">{it.batchNumber}<br/>{it.expiryDate}</td>
                                                        <td class="py-2 text-center font-bold">{it.qty}</td>
                                                        <td class="py-2 text-center font-semibold">{it.gstRate}%</td>
                                                        <td class="py-2 text-right font-bold">₹{it.taxableAmount.toFixed(2)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* Tax & Total Calculation */}
                                    <div class="border-t border-gray-300 pt-3 space-y-1 text-xs">
                                        <div class="flex justify-between text-gray-600">
                                            <span>Taxable Value (Subtotal):</span>
                                            <span>₹{receiptModal.transaction.taxableSubtotal.toFixed(2)}</span>
                                        </div>
                                        <div class="flex justify-between text-gray-600">
                                            <span>CGST Total:</span>
                                            <span>₹{receiptModal.transaction.totalCgst.toFixed(2)}</span>
                                        </div>
                                        <div class="flex justify-between text-gray-600">
                                            <span>SGST Total:</span>
                                            <span>₹{receiptModal.transaction.totalSgst.toFixed(2)}</span>
                                        </div>
                                        <div class="flex justify-between text-base font-black text-gray-900 pt-2 border-t-2 border-gray-900">
                                            <span>Grand Total (Incl. GST):</span>
                                            <span class="text-red-600">₹{receiptModal.transaction.grandTotal.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    <div class="text-center text-[11px] text-gray-500 pt-4 border-t border-gray-200 space-y-1">
                                        {receiptModal.copyType === 'customer' ? (
                                            <React.Fragment>
                                                <p class="font-bold text-gray-700">Thank you for visiting MedPlus!</p>
                                                <p>Medicines once sold can only be returned with original invoice within 7 days.</p>
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <p class="font-bold text-gray-900">MEDPLUS STORE AUDIT FILE COPY</p>
                                                <p>Internal inventory stock successfully deducted upon billing confirmation.</p>
                                            </React.Fragment>
                                        )}
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
